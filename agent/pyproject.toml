[project]
name = "agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "langchain>=1.5.2",
    "langchain-deepseek>=1.2.1",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.24",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
